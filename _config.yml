# Site Info
title:              "kim-hammar.com"
description:        "Personal Website"
author_name:        "Kim Hammar" # change this to your name
logo_url:           /assets/photos/profile.jpg
github_username:    Kim-Hammar # Your GitHub username here

# Site Settings
url:                https://kim-hammar.com # main url
baseurl:            ""
permalink:          /:title # Post permalink
timezone:           Europe/Stockholm # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
mathjax:            true  # enables support for mathjax - set to 'false' to disable

# Site Build
highlighter:        rouge
markdown:           kramdown
kramdown:
    input:          GFM
sass:
    style:          :compressed
    silence_deprecations: [ "import" ] # local Jekyll 4 preview only; ignored by the GitHub Pages build

# Other Params
include:            [ "robots.txt" ]
exclude:            [ "LICENSE", "README.md", "CNAME", "vendor", "Gemfile", "script" ]
plugins:
  - jekyll-sitemap



defaults:
  -
    scope:
      path:         ""
    values:
      layout:       "null"
  -
    scope:
      type:         "pages"
    values:
      layout:       "page"
  -
    scope:
      type:         "posts"
    values:
      layout:       "post"
